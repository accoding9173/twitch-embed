<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twitch Embed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #18181b;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #efeff1;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: row;
    }
    #app iframe {
      border: 0;
      display: block;
    }
    .player { flex: 1 1 auto; height: 100%; }
    .player iframe { width: 100%; height: 100%; }
    .chat { flex: 0 0 340px; height: 100%; }
    .chat iframe { width: 100%; height: 100%; }

    /* HLS-Direkt-Player */
    .video-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    .video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 24px;
      color: #efeff1;
      font-size: 15px;
    }
    .overlay.tap { background: rgba(0,0,0,0.35); cursor: pointer; }
    .overlay .big { font-size: 40px; }
    .overlay button {
      margin-top: 8px;
      padding: 10px 18px;
      border-radius: 6px;
      border: 0;
      background: #9147ff;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .hidden { display: none !important; }

    /* Schmaler Screen: Player oben, Chat darunter */
    @media (max-width: 768px) {
      #app { flex-direction: column; }
      .chat { flex: 0 0 40%; width: 100%; }
    }

    /* Eingabemaske */
    #form {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
    }
    #form h1 { font-size: 20px; font-weight: 600; color: #efeff1; }
    #form p { font-size: 14px; color: #adadb8; }
    #form .row { display: flex; gap: 8px; width: 100%; max-width: 360px; }
    #form input {
      flex: 1 1 auto;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #3a3a3d;
      background: #0e0e10;
      color: #efeff1;
      font-size: 15px;
      outline: none;
    }
    #form input:focus { border-color: #9147ff; }
    #form button {
      padding: 10px 18px;
      border-radius: 6px;
      border: 0;
      background: #9147ff;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #form button:hover { background: #772ce8; }
    #form .err { color: #ff6b6b; font-size: 13px; min-height: 16px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    (function () {
      var VALID = /^[a-z0-9_]+$/;
      var params = new URLSearchParams(window.location.search);
      var channelRaw = (params.get("channel") || "").trim().toLowerCase();
      var showChat = params.get("chat") === "1";
      var muted = params.get("muted") === "1";
      var hlsMode = params.get("hls") === "1";
      var host = window.location.hostname;
      var app = document.getElementById("app");

      function showForm(prefill, errorMsg) {
        document.body.innerHTML = "";
        var form = document.createElement("div");
        form.id = "form";

        var h1 = document.createElement("h1");
        h1.textContent = "Twitch-Kanal eingeben";
        form.appendChild(h1);

        var p = document.createElement("p");
        p.textContent = "Nur Buchstaben (a-z), Zahlen und Unterstrich.";
        form.appendChild(p);

        var err = document.createElement("div");
        err.className = "err";
        err.textContent = errorMsg || "";
        form.appendChild(err);

        var row = document.createElement("div");
        row.className = "row";

        var input = document.createElement("input");
        input.type = "text";
        input.placeholder = "z. B. papaplatte";
        input.value = prefill || "";
        input.autofocus = true;
        row.appendChild(input);

        var btn = document.createElement("button");
        btn.textContent = "Los";
        row.appendChild(btn);

        form.appendChild(row);
        document.body.appendChild(form);

        function go() {
          var val = input.value.trim().toLowerCase();
          if (!VALID.test(val)) {
            err.textContent = "Ungültiger Kanalname.";
            return;
          }
          var url = new URL(window.location.href);
          url.search = "";
          url.searchParams.set("channel", val);
          window.location.href = url.toString();
        }

        btn.addEventListener("click", go);
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") go();
        });
        input.focus();
      }

      if (!channelRaw) {
        showForm("", "");
        return;
      }

      if (!VALID.test(channelRaw)) {
        showForm(channelRaw, "Ungültiger Kanalname (nur a-z, 0-9, _).");
        return;
      }

      var channel = encodeURIComponent(channelRaw);

      // Direkt-Player-Modus: laedt den rohen HLS-Stream in ein <video>.
      // Braucht KEIN parent -> funktioniert dort, wo Twitchs iframe-Player
      // blockiert wird (z. B. Notion-Handy-App, In-App-WebViews).
      if (hlsMode) {
        startHls(channelRaw);
        document.title = channelRaw + " · Twitch";
        return;
      }

      // Twitch prueft frame-ancestors ueber die GESAMTE iframe-Kette.
      // Beim Einbetten in Notion ist das top-Frame notion.so -> diese
      // Domains muessen als zusaetzliche parent-Parameter mit, sonst
      // blockt Twitch mit ERR_BLOCKED_BY_RESPONSE.
      var parents = [host, "www.notion.so", "notion.so"];
      var parentQS = parents
        .filter(function (v, i) { return v && parents.indexOf(v) === i; })
        .map(function (p) { return "parent=" + encodeURIComponent(p); })
        .join("&");

      var player = document.createElement("div");
      player.className = "player";
      var playerFrame = document.createElement("iframe");
      playerFrame.src = "https://player.twitch.tv/?channel=" + channel +
        "&" + parentQS + "&muted=" + (muted ? "true" : "false");
      playerFrame.allowFullscreen = true;
      playerFrame.setAttribute("allow", "autoplay; fullscreen");
      player.appendChild(playerFrame);
      app.appendChild(player);

      if (showChat) {
        var chat = document.createElement("div");
        chat.className = "chat";
        var chatFrame = document.createElement("iframe");
        chatFrame.src = "https://www.twitch.tv/embed/" + channel +
          "/chat?" + parentQS + "&darkpopout";
        chat.appendChild(chatFrame);
        app.appendChild(chat);
      }

      document.title = channelRaw + " · Twitch";

      // ----- HLS-Direkt-Player (kein parent noetig) -----
      function loadHlsJs(cb) {
        if (window.Hls) { cb(); return; }
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";
        s.onload = cb;
        s.onerror = function () { cb(); };
        document.head.appendChild(s);
      }

      function startHls(ch) {
        var CID = "kimne78kx3ncx6brgo4mv6wki5h1ko";
        var root = document.getElementById("app");
        root.innerHTML = "";

        var wrap = document.createElement("div");
        wrap.className = "video-wrap";
        var video = document.createElement("video");
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.controls = true;
        video.autoplay = true;
        video.muted = muted;
        wrap.appendChild(video);

        var overlay = document.createElement("div");
        overlay.className = "overlay";
        overlay.textContent = "Lade Stream…";
        wrap.appendChild(overlay);
        root.appendChild(wrap);

        function hideOverlay() { overlay.classList.add("hidden"); }
        function fail(text) {
          overlay.className = "overlay";
          overlay.innerHTML = '<div class="big">⚠️</div><div>' + text + '</div>';
          var b = document.createElement("button");
          b.textContent = "Neu laden";
          b.addEventListener("click", function () { location.reload(); });
          overlay.appendChild(b);
          overlay.classList.remove("hidden");
        }

        function tryPlay() {
          var pr = video.play();
          if (pr && pr.catch) {
            pr.then(function () { if (!overlay.classList.contains("tap")) hideOverlay(); })
              .catch(function () {
                // Autoplay mit Ton blockiert -> stumm starten, Tap fuer Ton
                video.muted = true;
                video.play().catch(function () {});
                if (!muted) {
                  overlay.className = "overlay tap";
                  overlay.innerHTML = '<div class="big">🔇</div><div>Tippen für Ton</div>';
                  overlay.classList.remove("hidden");
                  overlay.addEventListener("click", function () {
                    video.muted = false;
                    video.play().catch(function () {});
                    hideOverlay();
                  }, { once: true });
                } else {
                  hideOverlay();
                }
              });
          }
        }

        var started = false;
        function markStarted() {
          started = true;
          if (!overlay.classList.contains("tap")) hideOverlay();
        }
        video.addEventListener("playing", markStarted);
        video.addEventListener("loadeddata", markStarted);
        // Watchdog: wenn nach 25s nichts laeuft -> Hinweis statt Endlos-Spinner
        setTimeout(function () {
          if (!started && video.currentTime === 0) {
            fail("Stream lädt nicht – Proxy/Netz? Mit Button neu laden.");
          }
        }, 25000);

        function usherUrl(t) {
          var p = new URLSearchParams();
          p.set("sig", t.signature);
          p.set("token", t.value);
          p.set("allow_source", "true");
          p.set("allow_audio_only", "true");
          p.set("fast_bread", "true");
          p.set("player", "twitchweb");
          p.set("type", "any");
          p.set("p", String(Math.floor(Math.random() * 1e7)));
          return "https://usher.ttvnw.net/api/channel/hls/" +
            encodeURIComponent(ch) + ".m3u8?" + p.toString();
        }

        // usher sendet KEIN CORS -> Master-Playlist via Proxy holen.
        // Eigenen Proxy via &proxy=<prefix> setzbar (Prefix bekommt die
        // URL-codierte usher-URL angehaengt), sonst Gratis-Proxys.
        function masterViaProxy(usher) {
          var custom = params.get("proxy");
          var proxies = custom ? [custom] : [
            "https://twitch-proxy.janoschi1811.workers.dev/?url=",
            "https://api.allorigins.win/raw?url=",
            "https://api.codetabs.com/v1/proxy/?quest="
          ];
          var i = 0;
          function next() {
            if (i >= proxies.length) return Promise.reject(new Error("proxy"));
            var pfx = proxies[i++];
            return fetch(pfx + encodeURIComponent(usher))
              .then(function (r) { if (!r.ok) throw new Error("bad"); return r.text(); })
              .then(function (txt) {
                if (txt.indexOf("#EXTM3U") === 0) return { text: txt };
                // Twitch-Fehler-JSON ([{"error":"..."}]) = Kanal offline
                if (txt.indexOf("\"error\"") >= 0) return { offline: true };
                throw new Error("bad");
              })
              .catch(function (e) {
                if (e && e.message === "offline") throw e;
                return next();
              });
          }
          return next();
        }

        function playHlsJs(masterText) {
          var blobUrl = URL.createObjectURL(
            new Blob([masterText], { type: "application/vnd.apple.mpegurl" }));
          loadHlsJs(function () {
            if (window.Hls && window.Hls.isSupported()) {
              var hls = new window.Hls({ lowLatencyMode: true, liveSyncDurationCount: 3 });
              hls.on(window.Hls.Events.MANIFEST_PARSED, function () { tryPlay(); });
              hls.on(window.Hls.Events.ERROR, function (e, data) {
                if (data && data.fatal) fail("Stream-Fehler beim Abspielen.");
              });
              hls.loadSource(blobUrl);
              hls.attachMedia(video);
            } else {
              fail("Dein Browser kann HLS nicht abspielen.");
            }
          });
        }

        var body = {
          operationName: "PlaybackAccessToken",
          variables: { isLive: true, login: ch, isVod: false, vodID: "", playerType: "site" },
          extensions: { persistedQuery: { version: 1,
            sha256Hash: "0828119ded1c13477966434e15800ff57ddacf13ba1911c129dc2200705b0712" } }
        };

        fetch("https://gql.twitch.tv/gql", {
          method: "POST",
          headers: { "Client-ID": CID, "Content-Type": "application/json" },
          body: JSON.stringify(body)
        })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            var t = j && j.data && j.data.streamPlaybackAccessToken;
            if (!t || !t.value) throw new Error("no-token");
            var usher = usherUrl(t);

            // iOS/Safari: natives HLS, Media-Element braucht KEIN CORS.
            if (video.canPlayType("application/vnd.apple.mpegurl")) {
              video.addEventListener("error", function () {
                fail(ch + " ist offline oder nicht ladbar.");
              }, { once: true });
              video.src = usher;
              tryPlay();
              return;
            }

            // Android/Chrome: hls.js -> Master via Proxy.
            return masterViaProxy(usher).then(function (res) {
              if (res.offline) { fail(ch + " ist gerade offline."); return; }
              playHlsJs(res.text);
            });
          })
          .catch(function (err) {
            if (err && err.message === "offline") fail(ch + " ist gerade offline.");
            else if (err && err.message === "proxy")
              fail("Proxy gerade nicht erreichbar – bitte neu laden.");
            else fail("Konnte den Stream nicht laden.");
          });
      }
    })();
  </script>
</body>
</html>
